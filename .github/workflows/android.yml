# يبني ملف APK موقّعًا بالمفتاح الثابت عند كل رفع إلى main، ويمكن تشغيله يدويًا من تبويب Actions
name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: تثبيت الحزم وبناء الواجهة
        run: |
          npm ci
          VITE_APP_VERSION="$(node -p 'require("./package.json").version').${{ github.run_number }}" npm run build
          npx cap sync android

      - name: فك مفتاح التوقيع
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::لم يُضَف المفتاح KEYSTORE_BASE64 إلى GitHub Secrets"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: بناء APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export VERSION_NAME="$(node -p 'require("../package.json").version').${{ github.run_number }}"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk "../out/muraja-$VERSION_NAME.apk"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

      - name: التحقق من التوقيع
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs out/*.apk | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: muraja-${{ env.VERSION_NAME }}
          path: out/*.apk

      # كل بناء ناجح يُنشر كإصدار في صفحة Releases ليسهل تنزيله على الهاتف مباشرة
      - name: نشر الإصدار
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message || 'بناء يدوي' }}
        run: |
          gh release create "v$VERSION_NAME" out/*.apk \
            --title "رفيق المراجعة $VERSION_NAME" \
            --notes "$NOTES"
